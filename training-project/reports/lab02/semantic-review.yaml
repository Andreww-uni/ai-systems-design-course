findings:
  definition: "Acceptable. The definition reproduces the first sentence of section 1.3 and represents Structured Output as the source uses the term: model output intended to follow an explicit machine-readable organization."
  control_gates: "Acceptable. Each exact quote supports its claim kind: the definition quote defines the term, the schema quote shows that syntax does not prove meaning, and the reviewer quote states the authority boundary. The key points name the syntactic gate, the deterministic invariant gate, and the semantic acceptance gate, and state that a schema proves only that a field exists, so neither deterministic gate receives semantic authority."
  authority_boundary: "Acceptable. The third key point and the authority-boundary quote preserve the boundary: the model emits a candidate proposal, the authorized human reviewer decides, and only a separately authorized operation writes accepted state."
rationale: "The candidate adds no meaning that section 1.3 does not support; the human-revised key points restate the source and the definition and quotes come unchanged from the live run. The tags and key points serve the learning purpose and contain no provider or harness metadata. The candidate is therefore acceptable."
