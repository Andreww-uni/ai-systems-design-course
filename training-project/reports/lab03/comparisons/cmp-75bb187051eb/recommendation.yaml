blocking_failures: Any rubric category U on any held-out attempt of a configuration is a critical unsupported-claim
  failure that violates the blocking condition for that configuration, regardless of its other counts.
decision_rule:
  recommend-b: B has no blocking failure, meets semantic and operational acceptance, and the tradeoff
    rule justifies replacing A.
  retain-a: A has no blocking failure and meets semantic acceptance, while B fails a condition or does
    not justify the change under the tradeoff rule.
  reject-both: Both A and B violate the blocking condition or both fail semantic acceptance.
  seek-more-evidence: Route failures, closed positions, X assessments, or unresolved uncertainty leave
    the comparison unable to support another outcome.
